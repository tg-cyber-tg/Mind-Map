<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Mappe Mentali</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="60%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.32"/>
    </filter>
  </defs>
  <!-- Fondo moderno ardesia → blu -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Rami organici sottili -->
  <g fill="none" stroke-width="11" stroke-linecap="round" opacity="0.92">
    <path d="M256 256 C 194 256 184 148 122 142" stroke="#60A5FA"/>
    <path d="M256 256 C 318 256 328 148 390 142" stroke="#34D399"/>
    <path d="M256 256 C 194 256 184 364 122 370" stroke="#FBBF24"/>
    <path d="M256 256 C 318 256 328 364 390 370" stroke="#C084FC"/>
  </g>
  <!-- Nodi figli a card -->
  <g filter="url(#sh)">
    <rect x="64" y="110" width="112" height="62" rx="18" fill="#F8FAFC" stroke="#60A5FA" stroke-width="5"/>
    <circle cx="92" cy="141" r="9" fill="#2563EB"/>
    <rect x="111" y="135" width="44" height="12" rx="6" fill="#334155"/>

    <rect x="336" y="110" width="112" height="62" rx="18" fill="#F8FAFC" stroke="#34D399" stroke-width="5"/>
    <circle cx="364" cy="141" r="9" fill="#059669"/>
    <rect x="383" y="135" width="44" height="12" rx="6" fill="#334155"/>

    <rect x="64" y="340" width="112" height="62" rx="18" fill="#F8FAFC" stroke="#FBBF24" stroke-width="5"/>
    <circle cx="92" cy="371" r="9" fill="#D97706"/>
    <rect x="111" y="365" width="44" height="12" rx="6" fill="#334155"/>

    <rect x="336" y="340" width="112" height="62" rx="18" fill="#F8FAFC" stroke="#C084FC" stroke-width="5"/>
    <circle cx="364" cy="371" r="9" fill="#7C3AED"/>
    <rect x="383" y="365" width="44" height="12" rx="6" fill="#334155"/>
  </g>
  <!-- Nodo centrale -->
  <g filter="url(#sh)">
    <rect x="166" y="206" width="180" height="100" rx="30" fill="#FFFFFF"/>
    <rect x="206" y="238" width="100" height="14" rx="7" fill="#1E293B"/>
    <rect x="224" y="264" width="64" height="12" rx="6" fill="#64748B"/>
  </g>
</svg>
